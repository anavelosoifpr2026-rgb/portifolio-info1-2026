<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Semântico</title>
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Arial, Helvetica, sans-serif;
            }
            body{
                background-color: #f0f0f0;
                padding: 20px;
            }
            header{
                background-color: #3498db;
                color: white;
                padding: 20px;
            }
            nav{
                background-color: #e67e22;
                padding: 15px;
            }
            nav ul{
                margin-left: 20px;
            }
            nav a{
                color: white;
                text-decoration: none;
            }
            main{
                background-color: #f1c40f;
                padding: 20px;
                margin-top: 10px;
            }

            article{
                background-color: #2ecc71;
                padding: 20px;
                margin-top: 15px;
            }
            aside{
                background-color: #9b59b6;
                color: white;
                padding: 20px;
                margin-top: 15px;
            }
            footer{
                background-color: #2c3e50;
                color: white;
                text-align: center;
                padding: 20px;
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Título do Site (Header)</h1>
        </header>
        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Sobre</a></li>
            </ul>
        </nav>
        <main>
            <section>
                <h2>Nossa Missão (Section)</h2>
                <article>
                    <h3>História da Empresa (Article)</h3>
                    <p>Conteúdo independente...</p>
                </article>
                <aside>
                    <p>Links Relacionados (Aside)</p>
                </aside>
            </section>
        </main>
        <footer>
            <p>© 2026 - Rodapé Semântico</p>
        </footer>
    </body>
    </html>
